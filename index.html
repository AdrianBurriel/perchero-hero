<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perchero hero · prototipo</title>
  </head>
  <body>
    <main class="hero">
      <header class="hero__head">
        <p class="hero__count">11 maillots en percha</p>
        <p class="hero__hint">Pasa por encima de un maillot · haz clic para ver el detalle</p>
      </header>

      <section class="rack" aria-label="Perchero de maillots">
        <div class="rack__rail" aria-hidden="true"></div>
        <div class="rack__items" id="rail"></div>
      </section>

      <aside class="detail" id="detail" hidden>
        <button class="detail__close" id="detail-close" aria-label="Cerrar">×</button>
        <h2 class="detail__name" id="detail-name"></h2>
        <p class="detail__brand" id="detail-brand"></p>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
