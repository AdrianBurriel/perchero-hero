<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perchero · prototipo</title>
    <!-- Favicon: la percha 3D de la web (renderizada con three.js) sobre crema -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#d6d0c4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Fondo de la carga antes de que llegue el CSS (en desarrollo lo inyecta el JS) -->
    <style>.loader { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh; z-index: 1000; background: #d6d0c4; } .loader > * { visibility: hidden; }</style>
    <noscript><style>.loader { display: none; }</style></noscript>
  </head>
  <body>
    <!-- Pantalla de carga (src/ui/loader.ts): visible desde el primer pintado -->
    <div class="loader" id="loader" role="status">
      <canvas class="loader__canvas" aria-hidden="true"></canvas>
      <p class="loader__label">Colgando las prendas</p>
    </div>
    <main class="hero">
      <header class="topbar topbar--over">
        <p class="topbar__crumb" id="stock">11 / 11 prendas en percha</p>
        <!-- Selector de sección: la pastilla se desliza entre las dos páginas -->
        <nav class="switch" aria-label="Sección">
          <span class="switch__pill" aria-hidden="true"></span>
          <a class="switch__opt" href="/" aria-current="page">Perchero</a>
          <a class="switch__opt" href="/shop-the-look.html">Shop the look</a>
        </nav>
        <div class="topbar__end" id="cart-slot"></div>
      </header>
      <p class="hero__hint">Pasa por encima de una prenda para verla de frente</p>
      <!-- RackHero monta aquí el lienzo, las flechas y la ficha de la prenda seleccionada -->
      <section class="hero__rack" id="rack" aria-label="Perchero de prendas"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
