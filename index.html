<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perchero · prototipo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="hero">
      <header class="topbar topbar--over">
        <p class="topbar__crumb" id="stock">11 prendas en percha</p>
        <!-- Selector de sección: la pastilla se desliza entre las dos páginas -->
        <nav class="switch" aria-label="Sección">
          <span class="switch__pill" aria-hidden="true"></span>
          <a class="switch__opt" href="/" aria-current="page">Perchero</a>
          <a class="switch__opt" href="/shop-the-look.html">Shop the look</a>
        </nav>
        <div class="topbar__end" id="cart-slot"></div>
      </header>
      <p class="hero__hint">Pasa por encima de una prenda · haz clic para ver el detalle</p>
      <!-- RackHero monta aquí el lienzo, las flechas y el detalle -->
      <section class="hero__rack" id="rack" aria-label="Perchero de prendas"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
