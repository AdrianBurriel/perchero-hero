<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop the look · Perchero</title>
    <!-- Favicon: la percha 3D de la web (renderizada con three.js) sobre crema -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#d6d0c4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Fondo de la carga antes de que llegue el CSS (en desarrollo lo inyecta el JS) -->
    <style>.loader { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh; z-index: 1000; background: #d6d0c4; } .loader > * { visibility: hidden; }</style>
    <noscript><style>.loader { display: none; }</style></noscript>
  </head>
  <body class="page">
    <!-- Pantalla de carga (src/ui/loader.ts): visible desde el primer pintado -->
    <div class="loader" id="loader" role="status">
      <canvas class="loader__canvas" aria-hidden="true"></canvas>
      <p class="loader__label">Colgando las prendas</p>
    </div>
    <header class="topbar">
      <p class="topbar__crumb" id="stock">Look 01 · 4 / 4 prendas en percha</p>
      <!-- Selector de sección: la pastilla se desliza entre las dos páginas -->
      <nav class="switch" aria-label="Sección">
        <span class="switch__pill" aria-hidden="true"></span>
        <a class="switch__opt" href="/">Perchero</a>
        <a class="switch__opt" href="/shop-the-look.html" aria-current="page">Shop the look</a>
      </nav>
      <div class="topbar__end" id="cart-slot"></div>
    </header>
    <main class="look">
      <div class="look__intro">
        <div class="look__heading">
          <p class="eyebrow" id="look-eyebrow"></p>
          <h1 class="look__title" id="look-title"></h1>
          <p class="look__subtitle" id="look-subtitle"></p>
        </div>
        <div class="look__buy">
          <p class="look__total"><span id="look-count"></span><strong id="look-total"></strong></p>
          <button class="btn btn--dark" id="buy-look" type="button">Comprar el look</button>
          <!-- Con el look entero en la cesta: devuelve todas las prendas a sus perchas -->
          <button class="look__return" id="return-look" type="button" hidden>Devolver al perchero</button>
        </div>
      </div>
      <figure class="look__photo">
        <!-- Marco con la proporción de la foto: los puntos (en %) caen siempre sobre su prenda -->
        <div class="look__frame">
          <!-- Capa ampliada: foto y puntos se encuadran juntos, así los puntos no se descolocan -->
          <div class="look__layer">
            <img id="look-img" alt="" />
            <!-- Un punto por prenda: selecciona esa prenda en el perchero -->
            <div class="look__spots" id="look-spots"></div>
          </div>
          <!-- Detalle de la prenda activa del perchero, abierto desde el principio -->
          <aside class="look__detail" id="look-detail" aria-live="polite" aria-labelledby="look-detail-name"></aside>
        </div>
      </figure>
      <section class="look__rack" id="look-rack" aria-label="Perchero con las prendas del look"></section>
    </main>
    <script type="module" src="/src/shop.ts"></script>
  </body>
</html>
